name: Finite graph research replay

on:
  pull_request:
    paths:
      - 'docs/design/finite-graph/**'
      - 'docs/design/pascal/source-board.json'
      - '.github/workflows/finite-graph.yml'
  push:
    branches: [main]
    paths:
      - 'docs/design/finite-graph/**'
      - 'docs/design/pascal/source-board.json'
      - '.github/workflows/finite-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 docs/design/finite-graph/experiment.py --check
